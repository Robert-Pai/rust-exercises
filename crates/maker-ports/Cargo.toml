[package]
name = "maker-ports"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[dependencies]
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
maker-domain = { path = "../maker-domain" }
maker-runtime = { path = "../maker-runtime" }
rust_decimal.workspace = true
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
