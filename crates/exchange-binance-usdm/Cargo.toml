[package]
name = "exchange-binance-usdm"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
futures-util = "0.3"
maker-domain = { path = "../maker-domain" }
maker-ports = { path = "../maker-ports" }
maker-runtime = { path = "../maker-runtime" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = "1"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
rust_decimal_macros = "1"
