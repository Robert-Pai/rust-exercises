[package]
name = "hello"
version = "0.1.0"
edition = "2024"

[dependencies]
hello-macro = { path = "hello-macro" }
futures = "0.3"
tokio = { version = "1", features = ["full"] }

[workspace]
members = ["apps/*", "crates/*", "hello-macro"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
proptest = "1"
rust_decimal = "1"
thiserror = "2"
