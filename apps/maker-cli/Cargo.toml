[package]
name = "maker-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "maker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
exchange-binance-usdm = { path = "../../crates/exchange-binance-usdm" }
maker-domain = { path = "../../crates/maker-domain" }
maker-engine = { path = "../../crates/maker-engine" }
maker-runtime = { path = "../../crates/maker-runtime" }
rust_decimal = { version = "1", features = ["serde-with-str"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }

[dev-dependencies]
tempfile = "3"
